<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JP // Admin</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="admin-main">
  <section id="login-view" class="admin-login">
    <p class="mono eyebrow">PRIVATE CHANNEL // ADMIN</p>
    <h1 class="section__title">Portfolio control room.</h1>
    <form id="login-form" class="panel" novalidate>
      <label class="field"><span>Admin password</span><input id="admin-password" type="password" required autocomplete="current-password" /></label>
      <button class="btn btn--primary" type="submit">Enter control room</button>
      <p id="login-status" class="form-status mono" role="status"></p>
    </form>
  </section>

  <section id="admin-view" class="admin-hidden">
    <header class="admin-header">
      <div><p class="mono eyebrow">CONTROL ROOM // CONTENT</p><h1 class="section__title">Portfolio uploads.</h1></div>
      <button id="logout" class="btn btn--ghost" type="button">Log out</button>
    </header>
    <div class="admin-grid">
      <form id="upload-form" class="panel" novalidate>
        <p class="mono panel__label">content.upload()</p>
        <label class="field"><span>Category</span><select id="upload-category" name="category"><option value="certification">Certification</option><option value="project">Project</option><option value="resume">Resume</option><option value="other">Other</option></select></label>
        <label class="field"><span>Title</span><input id="upload-title" name="title" type="text" required /></label>
        <label class="field"><span>Description</span><textarea id="upload-description" name="description" rows="4"></textarea></label>
        <label class="field"><span>File</span><input id="upload-file" name="file" type="file" required /></label>
        <button class="btn btn--primary" type="submit">Upload content</button>
        <p id="upload-status" class="form-status mono" role="status"></p>
      </form>
      <form id="profile-form" class="panel" novalidate>
        <p class="mono panel__label">profile.image()</p>
        <p class="admin-note">This image appears in the profile circle at the top of the public portfolio.</p>
        <label class="field"><span>Profile photo</span><input id="profile-file" type="file" accept="image/*" required /></label>
        <button class="btn btn--primary" type="submit">Update profile photo</button>
        <p id="profile-status" class="form-status mono" role="status"></p>
      </form>
    </div>
    <section class="panel" style="margin-top:1.5rem">
      <p class="mono panel__label">content.library()</p>
      <div id="admin-files" class="admin-list"></div>
    </section>
  </section>
</main>
<script>
const keyName = "portfolio-admin-password";
const loginView = document.getElementById("login-view");
const adminView = document.getElementById("admin-view");
const loginStatus = document.getElementById("login-status");
const uploadStatus = document.getElementById("upload-status");
const profileStatus = document.getElementById("profile-status");
const escapeHtml = (value) => { const div = document.createElement("div"); div.textContent = value || ""; return div.innerHTML; };
const setStatus = (element, text, state) => { element.textContent = text; element.dataset.state = state || ""; };
const authHeaders = () => ({ "x-admin-password": sessionStorage.getItem(keyName) });

async function showAdmin() {
  loginView.classList.add("admin-hidden");
  adminView.classList.remove("admin-hidden");
  const res = await fetch("/api/public-content");
  renderFiles(await res.json());
}
function renderFiles(content) {
  const list = document.getElementById("admin-files");
  list.innerHTML = content.files.length ? content.files.map((file) => `<div class="file-item"><span><strong>${escapeHtml(file.title || file.original_name)}</strong><small>${escapeHtml(file.category)} · ${escapeHtml(file.description)}</small></span><button type="button" data-id="${file.id}">delete</button></div>`).join("") : '<p class="admin-note">No uploads yet.</p>';
  list.querySelectorAll("button").forEach((button) => button.addEventListener("click", async () => {
    const res = await fetch(`/api/files/${button.dataset.id}`, { method: "DELETE", headers: authHeaders() });
    if (res.ok) showAdmin();
  }));
}
document.getElementById("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("admin-password").value;
  const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }) });
  if (!res.ok) { setStatus(loginStatus, "Incorrect password.", "error"); return; }
  sessionStorage.setItem(keyName, password); showAdmin();
});
document.getElementById("upload-form").addEventListener("submit", async (event) => {
  event.preventDefault(); const form = new FormData(event.target);
  setStatus(uploadStatus, "Uploading...", "");
  const res = await fetch("/api/upload", { method: "POST", headers: authHeaders(), body: form });
  setStatus(uploadStatus, res.ok ? "Content published." : "Upload failed.", res.ok ? "ok" : "error");
  if (res.ok) { event.target.reset(); showAdmin(); }
});
document.getElementById("profile-form").addEventListener("submit", async (event) => {
  event.preventDefault(); const form = new FormData(); form.append("file", document.getElementById("profile-file").files[0]);
  const res = await fetch("/api/admin/profile", { method: "POST", headers: authHeaders(), body: form });
  setStatus(profileStatus, res.ok ? "Profile photo updated." : "Profile update failed.", res.ok ? "ok" : "error");
  if (res.ok) event.target.reset();
});
document.getElementById("logout").addEventListener("click", () => { sessionStorage.removeItem(keyName); location.reload(); });
if (sessionStorage.getItem(keyName)) showAdmin().catch(() => { sessionStorage.removeItem(keyName); });
</script>
</body>
</html>
