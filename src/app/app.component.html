
<!-- Custom Star Cursor -->
<div class="custom-cursor" 
     [style.transform]="'translate3d(' + cursorX + 'px, ' + cursorY + 'px, 0)'">
  ✨
</div>

<!-- Space Theme Background Elements -->
<div class="space-background">
  <div class="stars"></div>
  <div class="twinkling"></div>
</div>

<!-- Portfolio Content -->
<main class="portfolio-container">
  <header class="hero">
    <div class="hero-content">
      <h3 class="animate-fade-in delay-1">Welcome to my universe</h3>
      <h1 class="animate-slide-up delay-2">
        I'm <span class="highlight">Your Name</span>
      </h1>
      <p class="animate-slide-up delay-3">
        Full-Stack Developer crafting digital experiences out of this world.
      </p>
      
      <div class="action-buttons animate-fade-in delay-4">
        <button class="btn primary">Explore My Work</button>
        <button class="btn secondary">Contact Command</button>
      </div>
    </div>
  </header>
</main>
